[project]
name = "velvet_tts"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    # Linux x86_64 (glibc - Ubuntu, Debian, Colab, etc.)
    "llama-cpp-python @ https://github.com/abetlen/llama-cpp-python/releases/download/v0.3.38/llama_cpp_python-0.3.38-py3-none-manylinux2014_x86_64.manylinux_2_17_x86_64.whl ; sys_platform == 'linux' and platform_machine == 'x86_64'",

    # Linux ARM64 (glibc - Raspberry Pi 64-bit, AWS Graviton, etc.)
    "llama-cpp-python @ https://github.com/abetlen/llama-cpp-python/releases/download/v0.3.38/llama_cpp_python-0.3.38-py3-none-manylinux2014_aarch64.manylinux_2_17_aarch64.whl ; sys_platform == 'linux' and platform_machine == 'aarch64'",

    # Linux RISC-V
    "llama-cpp-python @ https://github.com/abetlen/llama-cpp-python/releases/download/v0.3.38/llama_cpp_python-0.3.38-py3-none-linux_riscv64.whl ; sys_platform == 'linux' and platform_machine == 'riscv64'",

    # macOS Apple Silicon (M1/M2/M3/M4)
    "llama-cpp-python @ https://github.com/abetlen/llama-cpp-python/releases/download/v0.3.38/llama_cpp_python-0.3.38-py3-none-macosx_11_0_arm64.whl ; sys_platform == 'darwin' and platform_machine == 'arm64'",

    # Windows x64
    "llama-cpp-python @ https://github.com/abetlen/llama-cpp-python/releases/download/v0.3.38/llama_cpp_python-0.3.38-py3-none-win_amd64.whl ; sys_platform == 'win32' and platform_machine == 'AMD64'",

    # Fallback for Intel Macs or unsupported architectures (builds from PyPI)
    "llama-cpp-python==0.3.38 ; (sys_platform == 'darwin' and platform_machine != 'arm64') or (sys_platform == 'linux' and platform_machine not in 'x86_64,aarch64,riscv64')",

    # Other dependencies
    "wetext",
    "pedalboard",
    "pocket-tts",
    "miocodec @ git+https://github.com/Aratako/MioCodec.git",
    "vocos @ git+https://github.com/langtech-bsc/vocos.git@matcha",
]
